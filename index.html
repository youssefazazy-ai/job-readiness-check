<style>

:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1614; --surface:#15201D; --ink:#E5EEEA; --muted:#93A49D; --line:#2A3833;

  --ok:#62CF92; --ok-bg:#16301F; --self:#93AEF5; --self-bg:#1B2540; --warn:#E6AE45; --warn-bg:#33270F; --gap:#F2826D; --gap-bg:#3A1C17; color-scheme:dark}}
:root[data-theme="dark"]{

  --ok:#62CF92; --ok-bg:#16301F; --self:#93AEF5; --self-bg:#1B2540; --warn:#E6AE45; --warn-bg:#33270F; --gap:#F2826D; --gap-bg:#3A1C17; color-scheme:dark}

.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1.2;margin:0;text-wrap:balance}

.note{font-size:13px;color:var(--muted);margin:0}
.msg{font-size:14px;margin:0;border-radius:8px;padding:8px 12px}

.list{display:flex;flex-direction:column;gap:18px;min-width:0}

.skill{min-width:0}
.skill .nm{font-family:var(--mono);font-size:14px;direction:ltr;unicode-bidi:isolate}
.skill .ct{font-size:12px;color:var(--muted);margin-inline-start:8px}
.src{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;unicode-bidi:plaintext}

.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--muted);padding:7px 10px;cursor:pointer;min-height:36px;white-space:nowrap}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="proof"]{background:var(--ok-bg);color:var(--ok);font-weight:600}
.seg button[aria-pressed="true"][data-v="know"]{background:var(--self-bg);color:var(--self);font-weight:600}
.seg button[aria-pressed="true"][data-v="none"]{background:var(--gap-bg);color:var(--gap);font-weight:600}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;width:32px;height:32px;border-radius:6px;cursor:pointer}
.x:hover{color:var(--gap);background:var(--gap-bg)}
.ev{grid-column:1/-1;order:4;display:flex;flex-direction:column;gap:4px;padding-inline-start:12px;border-inline-start:3px solid var(--ok)}
.ev label{font-size:12.5px;color:var(--muted)}
.ev input{font:inherit;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px;width:100%}
.add{display:flex;flex-wrap:wrap;gap:8px}
.add input,.add select{font:inherit;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
.add input{flex:1 1 180px;min-width:0}
.unmapped .ghost{align-self:flex-start}
#unmapped{display:flex;flex-direction:column;gap:12px}
.unmapped{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.unmapped h3{margin:0;font-size:14px}
.unmapped ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.unmapped li{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13.5px}
.unmapped li span{min-width:0;unicode-bidi:plaintext}
.result{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
#resultBody{display:flex;flex-direction:column;gap:16px}
.verdict .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.verdict h2{font-family:var(--display);font-weight:700;font-size:26px;margin:2px 0 4px;line-height:1.25}
.verdict p{margin:0;color:var(--muted)}
.lvl-strong{color:var(--ok)}.lvl-mid{color:var(--warn)}.lvl-stretch{color:var(--gap)}.lvl-pre{color:var(--muted)}
.meter{display:flex;gap:3px;height:12px}
.meter span{flex:1;border-radius:3px;background:var(--line)}
.meter .m-ev{background:var(--ok)}.meter .m-self{background:var(--self)}.meter .m-miss{background:var(--gap)}
.buckets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0}
.bk{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.bk dt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.bk dt i{width:9px;height:9px;border-radius:2px;display:inline-block}
.bk dd{margin:0;font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.bk dd small{font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted);margin-inline-start:4px}
.yrs{font-size:14px;border-inline-start:3px solid var(--warn);padding-inline-start:10px;margin:0}

.learn h4{margin:0 0 8px;font-family:var(--display);font-weight:500;font-size:16px}

.learn li::marker{font-family:var(--mono);color:var(--muted)}

.optin a{align-self:flex-start;text-decoration:none}

.posttext{white-space:pre-wrap;font-size:14px;line-height:1.7;margin-top:10px;unicode-bidi:plaintext;overflow-wrap:anywhere}
.posttext mark{color:inherit;border-radius:3px;padding:0 2px}
.posttext mark.req{background:var(--mark)}
.posttext mark.pref{background:transparent;box-shadow:inset 0 -2px 0 var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:12px 0;margin:0}

.mbar{display:none}

footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
</style>

/* Section headings. Matched against the whole line for short lines, or the start of the line for "Heading:" and markdown headings. */
const QUAL="(?:(?:job|key|basic|minimum|min|preferred|technical|required|the|your|our|main|core|general|additional|desired|initial|expected|important|other|soft|hard|personal|role)\\s+){0,2}";
const HEADS={
  skip:["about\\s+(?!the\\s+(?:role|job|position|opportunity))[^:：]{1,40}","who\\s+we\\s+are","company(?:\\s+\\w+)?","our\\s+company","what\\s+we\\s+offer","we\\s+offer","benefits?(?:\\s*(?:&|and)\\s*perks)?","perks(?:\\s*(?:&|and)\\s*benefits)?","why\\s+(?:join\\s+us|us|work\\s+with\\s+us|join)","compensation(?:\\s*(?:&|and)\\s*benefits)?","salary(?:\\s*(?:&|and)\\s*benefits)?","how\\s+to\\s+apply","to\\s+apply","application(?:\\s+\\w+)?","apply(?:\\s+now)?","deliverables?","milestones?","equal\\s+opportunity(?:\\s+\\w+)?","location","من\\s+نحن","عن\\s+(?:الشركة|المشروع)","المزايا","المميزات","ما\\s+نقدمه","نقدم","طريقة\\s+التقديم","للتقديم","التقديم","الراتب","المخرجات"],
  pref:["(?:nice|good|great)[- ]to[- ]haves?","preferred(?:\\s+\\w+){0,2}","desired(?:\\s+\\w+){0,2}","bonus(?:\\s+\\w+){0,2}","pluses","it'?s\\s+a\\s+plus","optional(?:\\s+\\w+)?","additional\\s+skills","يفضل","يُفضل","مميزات\\s+إضافية","ميزة\\s+إضافية","مهارات\\s+إضافية","إضافي","اضافي"],
  req:["requirements?(?:\\s*(?:&|and)\\s*\\w+)?","qualifications?(?:\\s*(?:&|and)\\s*\\w+)?","skills(?:\\s*(?:&|and)\\s*\\w+)?","skills\\s+and\\s+tools","must[- ]haves?","what\\s+we(?:'re|’re|\\s+are)\\s+looking\\s+for","who\\s+you\\s+are","you\\s+(?:have|bring|should\\s+have|will\\s+need)","what\\s+you(?:'ll|’ll|\\s+will)?\\s+(?:need|bring)","your\\s+profile","(?:the\\s+)?ideal\\s+candidate","(?:skills\\s*(?:&|and)\\s*)?experience(?:\\s*(?:&|and)\\s*\\w+)?","tech(?:nical)?\\s+(?:skills|stack)","(?:tech\\s+)?stack","المتطلبات","المؤهلات(?:\\s+المطلوبة)?","المهارات(?:\\s+المطلوبة)?","الشروط","مطلوب","متطلبات\\s+الوظيفة"],
  resp:["responsibilit(?:y|ies)","duties","what\\s+you(?:'ll|’ll|\\s+will)\\s+(?:do|be\\s+doing)","you\\s+will","the\\s+role","your\\s+role","role(?:\\s+\\w+)?","about\\s+the\\s+(?:role|job|position|opportunity)","job\\s+(?:description|brief|summary|overview|details)","description","overview","(?:technical\\s+)?scope","project(?:\\s+\\w+)?","in\\s+this\\s+role","day[- ]to[- ]day","your\\s+mission","المهام","المسؤوليات","الوصف\\s+الوظيفي","طبيعة\\s+العمل","وصف\\s+الوظيفة"]
};
const HFULL={},HPRE={};
for(const k in HEADS){const alt="(?:"+HEADS[k].join("|")+")";HFULL[k]=new RegExp("^"+QUAL+alt+"\\s*[:：]?$","i");HPRE[k]=new RegExp("^"+QUAL+alt+"(?![\\w])","i");}
const KIND_ORDER=["skip","pref","req","resp"];
const LEAD=/^(?:[-–—•*·▪▫●◦○■□➢➤►▶→✓✔☑✦✧❖◆◇★+]|\p{Extended_Pictographic}|️|‍|\s)+/u;
const NUM=/^(?:\d{1,2}[.)\-]|[a-zA-Z][.)])\s+/;
const deHtml=s=>s.replace(/<br\s*\/?>|<\/(?:li|p|div|h\d|tr|ul|ol)>/gi,"\n").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'");
const demd=s=>s.replace(/^\s*>\s?/,"").replace(/^\s*#{1,6}\s*/,"").replace(/\*\*|__|`/g,"").replace(/^\s*\*\s+/,"- ");

const SAMPLE=`Junior Full-Stack Developer (fictional example)
A fintech startup in Cairo

Responsibilities:
- Build and maintain features using React and Node.js
- Integrate RESTful APIs and third-party services
- Write clean, testable code and take part in code reviews

Requirements:
- 0–1 years of experience (internships and projects count)
- Strong JavaScript and TypeScript fundamentals
- Experience with React and Node.js / Express
- Working knowledge of SQL databases such as PostgreSQL
- Git and GitHub workflow
- Good English communication skills

Nice to have:
- Docker
- Unit testing with Jest
- Any cloud experience (AWS or Azure)`;
const SAMPLE_RATINGS={js:"proof",react:"proof",rest:"proof",git:"proof",ts:"know",node:"know",express:"know",sql:"know",english:"know",comm:"know",pg:"none",docker:"none",unit:"none",jest:"none"};
const SAMPLE_EV={js:"Booking app (DEPI project) on GitHub",react:"Booking app (DEPI project) on GitHub",rest:"Payment API integration in the booking app"};

const S={lang:"ar",text:"",items:[],unmapped:[],ratings:{},ev:{},example:true,analyzed:false,cid:0};
try{const l=localStorage.getItem("jrc-lang");if(l==="ar"||l==="en")S.lang=l;}catch(e){}
const T=()=>STR[S.lang];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const normDigits=s=>s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const stripBullet=s=>s.replace(LEAD,"").replace(NUM,"").replace(LEAD,"").trim();
function headingKind(core,prefix){for(const k of KIND_ORDER)if((prefix?HPRE:HFULL)[k].test(core))return k;return null;}

/* Pure: turns post text into detected skills (with priority and best source line), requirement lines no rule matched, and minimum years. */
function detect(text){
  const lines=normDigits(deHtml(text)).split(/\r?\n/);let kind=null;const found=new Map(),unmapped=[],yearLines=[];
  for(const raw of lines){
    const t=demd(raw).trim();if(!t)continue;
    const mdHead=/^\s*#{1,6}\s/.test(raw);
    const core=stripBullet(t);if(!core)continue;
    const bullet=!mdHead&&(LEAD.test(t)||NUM.test(t));
    const colonEnd=/[:：]$/.test(core), field=/^[^:：]{1,40}[:：]\s*\S/.test(core);
    const words=core.split(/\s+/).length;
    const heading=mdHead?core.length<100:(!field&&core.length<70&&(colonEnd||words<=5));
    if(heading){const k=headingKind(core.replace(/[:：]$/,"").trim(),false)||((mdHead||colonEnd)?headingKind(core,true):null);if(k)kind=k;}
    if(kind==="skip")continue;                                   /* about us, benefits, deliverables, how to apply */
    if(/\S+@\S+\.\S+|https?:\/\//i.test(core))continue;         /* contact lines */
    const expLine=/(experience|\bexp\b|خبر[ةه])/i.test(core);
    if(expLine||kind==="req"||kind==="pref")yearLines.push(core);
    const section=kind==="pref"?"pref":"req";
    let hit=false;
    /* A pasted paragraph holds many sentences; judge "nice to have" per sentence, not per line. */
    for(const sent of core.split(/(?<=[.!?؟;])\s+(?=[A-Z؀-ۿ])/)){
      const prio=(section==="pref"||PREF.test(sent))?"pref":"req";
      const isField=/^[^:：]{1,30}[:：]\s*\S/.test(sent);
      const rank=(kind==="req"?4:kind==="pref"?3:kind==="resp"?2:1)-(isField?.5:0);
      for(const r of RX){r.re.lastIndex=0;if(r.re.test(sent)){hit=true;
        const f=found.get(r.id);
        if(!f)found.set(r.id,{id:r.id,label:r.label,cat:r.cat,prio,src:sent,rank});
        else{if(prio==="req")f.prio="req";if(rank>f.rank){f.src=sent;f.rank=rank;}}
      }}
    }
    const yearsOnly=/^\D{0,20}\d{1,2}\s*(?:[-–]\s*\d{1,2}\s*)?\+?\s*(?:years?|yrs?|سنة|سنوات|سنين)/i.test(core)&&words<=8;
    if(!hit&&!heading&&!yearsOnly&&(kind==="req"||kind==="pref"||(kind===null&&bullet))&&core.length>3)
      unmapped.push({line:core,prio:(section==="pref"||PREF.test(core))?"pref":"req"});
  }
  return {items:[...found.values()],unmapped,years:minYears(yearLines.join("\n"))};
}
/* Pure: the minimum years a post asks for; 0 when it gives only a maximum ("up to 2") or a range starting at 0. */
function minYears(text){
  const W={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
  let t=normDigits(text)
    .replace(/\b(one|two|three|four|five|six|seven|eight|nine|ten)(?=\s*\+?\s*(?:\(\d+\)\s*)?(?:years?|yrs?)\b)/gi,w=>W[w.toLowerCase()])
    .replace(/\ba\s+year\b/gi,"1 year")
    .replace(/سنتين|سنتان|عامين|عامان/g,"2 سنة")
    .replace(/(عن|الأقل|الاقل)\s+(سنة|عام)(?!\s*\d)/g,"$1 1 $2");
  const U="(?:years?|yrs?|سنة|سنوات|سنين|أعوام|اعوام|عام)(?!\\s*old)";
  if(new RegExp("(?:up\\s*to|maximum(?:\\s*of)?|max\\.?|no\\s*more\\s*than|حتى|بحد\\s*أقصى)\\s*(\\d{1,2})\\s*\\+?\\s*"+U,"i").test(t))return 0;
  const r=t.match(new RegExp("(\\d{1,2})\\s*(?:"+U+")?\\s*(?:-|–|to|إلى|الى|ل)\\s*\\d{1,2}\\s*\\+?\\s*"+U,"i"));if(r)return parseInt(r[1],10);
  const m=t.match(new RegExp("(\\d{1,2})\\s*\\+?\\s*"+U,"i"));return m?parseInt(m[1],10):0;
}
/* Pure: classifies a rating. "proof" only counts as evidence when the user wrote something. */
function cls(id){const r=S.ratings[id];if(!r)return"un";if(r==="none")return"miss";if(r==="proof"&&(S.ev[id]||"").trim())return"ev";return"self";}
function compute(){
  const req=S.items.filter(i=>i.prio==="req"),base=req.length?req:S.items;
  const count=(xs,k)=>xs.filter(i=>cls(i.id)===k).length;
  const b={};for(const k of ["ev","self","miss","un"])b[k]={all:count(S.items,k),req:count(req,k)};
  const n=base.length,E=count(base,"ev"),M=count(base,"miss"),U=count(base,"un");
  let level;
  if(U)level="pre";
  else if(M===0&&E>=.6*n)level="strong";
  else if(M<=n/3)level="mid";
  else level="stretch";
  const order=[["req","miss"],["req","self"],["pref","miss"],["pref","self"]];
  const plan=[];for(const [pr,k] of order)for(const i of S.items)if(i.prio===pr&&cls(i.id)===k)plan.push(i);
  return {base,b,n,U,level,plan:plan.slice(0,6),yrs:S.yrs||0};
}
function spans(text){
  const prio=Object.fromEntries(S.items.map(i=>[i.id,i.prio]));const out=[];
  for(const r of RX){if(!prio[r.id])continue;r.re.lastIndex=0;let m;
    while((m=r.re.exec(text))){if(!m[0].length){r.re.lastIndex++;continue;}out.push([m.index,m.index+m[0].length,prio[r.id]]);}}
  out.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);const res=[];let end=-1;
  for(const s of out){if(s[0]>=end){res.push(s);end=s[1];}}return res;
}

function setMsg(kind,text){const m=$("postMsg");m.hidden=!text;m.className="msg "+(kind||"");m.textContent=text||"";$("post").setAttribute("aria-invalid",kind==="err"?"true":"false");}
function analyze(fromExample){
  const t=T(),txt=$("post").value;
  if(!txt.trim()){setMsg("err",t.errEmpty);$("post").focus();return;}
  setMsg(txt.trim().length<120&&!fromExample?"warn":"",txt.trim().length<120&&!fromExample?t.warnShort:"");
  const d=detect(txt);S.text=txt;S.items=d.items;S.unmapped=d.unmapped;S.yrs=d.years;S.showAllUnmapped=false;S.analyzed=true;S.example=!!fromExample;
  S.ratings=fromExample?{...SAMPLE_RATINGS}:{};S.ev=fromExample?{...SAMPLE_EV}:{};render();
}

function itemRow(it){
  const t=T(),v=S.ratings[it.id];
  const b=k=>`<button type="button" data-v="${k}" aria-pressed="${v===k}">${t[k]}</button>`;
  const ev=v==="proof"?`<div class="ev"><label for="ev-${it.id}">${t.evLabel}</label><input id="ev-${it.id}" data-ev="${it.id}" type="text" autocomplete="off" placeholder="${esc(t.evPh)}" value="${esc(S.ev[it.id]||"")}"></div>`:"";
  return `<li class="item" data-id="${it.id}">
    <div class="skill"><span class="nm">${esc(it.label)}</span><span class="ct">${esc(t.cats[it.cat]||"")}</span>${it.src?`<span class="src" title="${esc(it.src)}">${esc(it.src)}</span>`:""}</div>
    <div class="seg" role="group" aria-label="${esc(it.label)}">${b("none")}${b("know")}${b("proof")}</div>
    <button type="button" class="x" data-rm="${it.id}" aria-label="${t.remove} ${esc(it.label)}">×</button>${ev}</li>`;
}
function renderList(){
  const t=T(),g=$("groups");
  if(!S.analyzed){g.innerHTML=`<p class="empty">${t.noPost}</p>`;}
  else if(!S.items.length){g.innerHTML=`<p class="empty">${t.noItems}</p>`;}
  else{
    const grp=(p,h)=>{const xs=S.items.filter(i=>i.prio===p);if(!xs.length)return"";
      return `<div class="group"><h3><span class="pill" style="color:${p==="req"?"var(--ink)":"var(--accent)"}">${p==="req"?t.req:t.pref}</span>${h} · ${xs.length}</h3><ul class="items">${xs.map(itemRow).join("")}</ul></div>`;};
    g.innerHTML=grp("req",t.reqH)+grp("pref",t.prefH);
  }
  const u=$("unmapped");
  const tech=S.items.filter(i=>!["biz","soft","custom"].includes(i.cat)).length;
  const scope=S.analyzed&&S.text.trim().length>300&&tech<2?`<p class="msg warn">${t.offScope}</p>`:"";
  const lim=S.showAllUnmapped?S.unmapped.length:6,more=S.unmapped.length>lim?`<button type="button" class="btn small ghost" id="moreUnmapped">${t.showAll(S.unmapped.length)}</button>`:"";
  u.innerHTML=scope+(S.analyzed&&S.unmapped.length?`<div class="unmapped"><h3>${t.unmappedH}</h3><p class="note">${t.unmappedP}</p><ul>${S.unmapped.slice(0,lim).map((x,k)=>`<li><span>${esc(x.line)}</span><button type="button" class="btn small" data-addline="${k}">${t.addThis}</button></li>`).join("")}</ul>${more}</div>`:"");
}
function renderPost(){
  const txt=S.text;if(!txt.trim()){$("postView").textContent="";return;}
  let h="",i=0;for(const [a,b,p] of spans(txt)){h+=esc(txt.slice(i,a))+`<mark class="${p}">${esc(txt.slice(a,b))}</mark>`;i=b;}
  $("postView").innerHTML=h+esc(txt.slice(i));
}
function renderResult(){
  const t=T(),r=$("resultBody");
  if(!S.analyzed||!S.items.length){r.innerHTML=`<p class="empty">${S.analyzed?t.noItems:t.noPost}</p>`;$("mbar").hidden=true;return;}
  const c=compute();
  const meter=`<div class="meter" aria-hidden="true">${c.base.map(i=>{const k=cls(i.id);return `<span class="${k==="un"?"":"m-"+k}"></span>`;}).join("")}</div>`;
  const bk=(k,label,color)=>`<div class="bk"><dt><i style="background:${color}"></i>${label}</dt><dd>${c.b[k].all}<small>${t.ofReq(c.b[k].req)}</small></dd></div>`;
  const lvClass={strong:"lvl-strong",mid:"lvl-mid",stretch:"lvl-stretch",pre:"lvl-pre"}[c.level];
  const lvP=c.level==="pre"?t.preP(c.U):t[c.level+"P"];
  const why=i=>i.custom?t.whyCustom:`${i.prio==="req"?t.whyReq:t.whyPref} <q>${esc(i.src||i.label)}</q>`;
  const plan=c.plan.length?`<ol>${c.plan.map(i=>{const k=cls(i.id),claim=k==="self"&&S.ratings[i.id]==="proof";
      const idea=t.proofIdea[i.id]||t.hint[i.cat]||t.hint.custom;
      const steps=claim?[t.stWrite]:k==="miss"?[t.stLearn,t.stProve+idea,t.stShow]:[t.stProve+idea,t.stShow];
      const tag=claim?`<span class="tag claim">${t.tagClaim}</span>`:k==="miss"?`<span class="tag miss">${t.tagMiss}</span>`:`<span class="tag self">${t.tagSelf}</span>`;
      return `<li><span class="t"><span class="nm">${esc(i.label)}</span>${tag}</span><span class="why">${why(i)}</span><ul class="steps">${steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></li>`;}).join("")}</ol>`
    :`<p class="note">${c.b.un.all?t.planWait(c.b.un.all):t.learnNone}</p>`;
  const optin=OPT_IN_URL?`<div class="optin"><strong>${t.optinH}</strong><span class="note">${t.optinP}</span><a class="btn primary" href="${esc(OPT_IN_URL)}" target="_blank" rel="noopener">${t.optinBtn}</a></div>`:"";
  r.innerHTML=`<div class="verdict"><span class="lbl">${t.lbl}</span><h2 class="${lvClass}">${t[c.level]}</h2><p>${lvP}</p></div>
    ${meter}
    <dl class="buckets">${bk("ev",t.bEv,"var(--ok)")}${bk("self",t.bSelf,"var(--self)")}${bk("miss",t.bMiss,"var(--gap)")}${bk("un",t.bUn,"var(--line)")}</dl>
    ${c.yrs>=1?`<p class="yrs">${t.yrs(c.yrs)}</p>`:""}
    <div class="learn"><h4>${t.learnH}</h4>${plan}</div>
    <details class="how"><summary>${t.howH}</summary><ul>${t.how.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>
    <div class="row"><button class="btn" type="button" id="copyBtn">${t.copy}</button></div>
    <div id="copyFb"></div>${optin}<p class="fine">${t.fine}</p>`;
  $("copyBtn").onclick=()=>copyResult(c);
  $("mbarV").textContent=t[c.level];$("mbarV").className=lvClass;
  $("mbarC").textContent=t.mbarC(S.items.filter(i=>S.ratings[i.id]).length,S.items.length);$("mbarGo").textContent=t.mbarGo;
  updateBar();
}
let resultVisible=false;
function updateBar(){$("mbar").hidden=!(S.analyzed&&S.items.length)||resultVisible;}
try{new IntersectionObserver(es=>{resultVisible=es[0].isIntersecting;updateBar();},{threshold:.15}).observe(document.querySelector(".result"));}catch(e){}
function copyResult(c){
  const t=T();const lab={ev:t.bEv,self:t.bSelf,miss:t.bMiss,un:t.bUn};
  const lines=[t.summaryHead,`${t.lbl}: ${t[c.level]}`,...["ev","self","miss","un"].map(k=>`${lab[k]}: ${c.b[k].all} (${t.ofReq(c.b[k].req)})`),"",t.learnH+":",...c.plan.map((i,k)=>`${k+1}. ${i.label}`)];
  const txt=lines.join("\n"),btn=$("copyBtn");

function render(){renderStatic();renderList();renderPost();renderResult();}
function addItem(label,prio,src){S.analyzed=true;S.items.push({id:"c"+(++S.cid),label,cat:"custom",prio,src:src||"",custom:!src});}

$("groups").addEventListener("click",e=>{
  const rm=e.target.closest("[data-rm]");

$("groups").addEventListener("input",e=>{const id=e.target.dataset&&e.target.dataset.ev;if(!id)return;S.ev[id]=e.target.value;renderResult();});

  const x=S.unmapped.splice(+b.dataset.addline,1)[0];const lab=x.line.length>48?x.line.slice(0,46)+"…":x.line;addItem(lab,x.prio,x.line);render();});
